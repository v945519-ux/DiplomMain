services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_TRUSTED_ORIGINS: ${SITE_ORIGIN:-http://localhost}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-false}
      DJANGO_BEHIND_PROXY: "true"
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - database:/data
      - media:/app/media
      - static:/app/staticfiles
  frontend:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: ${SITE_ORIGIN:-http://localhost}/api
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  database:
  media:
  static:
  caddy_data:
  caddy_config:
